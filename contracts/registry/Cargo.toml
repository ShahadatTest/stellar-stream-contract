[package]
name = "sentinel-registry"
version = "0.1.0"
edition = "2021"
publish = false
description = "Public watchlist of Soroban contracts whose state-archival deadline should be tracked"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "28.0.0" }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
