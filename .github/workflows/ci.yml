name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Install Stellar CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          URL=$(curl -sSL https://api.github.com/repos/stellar/stellar-cli/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*x86_64-unknown-linux-gnu.tar.gz"' \
            | head -1 | sed 's/.*"\(https[^"]*\)"/\1/')
          echo "Installing $URL"
          curl -sSL "$URL" | tar -xz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/stellar" --version

      - name: Build wasm
        run: stellar contract build

      - name: Report wasm hash
        run: |
          WASM=target/wasm32v1-none/release/sentinel_registry.wasm
          ls -lh "$WASM"
          sha256sum "$WASM" | tee wasm.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel_registry.wasm
          path: |
            target/wasm32v1-none/release/sentinel_registry.wasm
            wasm.sha256

  sdk:
    name: SDK + CLI (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
